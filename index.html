<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: rgb(255, 255, 255);
      background-image: url("https://cdn.wallpapersafari.com/30/0/n0HOqk.gif");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .profile-card {
      background-color: rgba(255, 255, 255, 0.45);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.2);
      width: 350px;
      padding: 40px 20px;
      text-align: center;
      color: #4a1d96;
      transition: transform 0.3s ease;
    }

    .profile-card:hover {
      transform: scale(1.05);
    }

    .profile-card img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #6c2fb3;
      box-shadow: 0 0 15px rgba(108, 47, 179, 0.5);
      margin-bottom: 20px;
    }

    .profile-card h2 {
      font-weight: bold;
      color: #3b0764;
    }

    .profile-card p {
      color: #5b21b6;
      font-size: 16px;
    }

    .btn-custom {
      background-image: linear-gradient(144deg, #af40ff, #5b42f3 50%, #e300eb);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 25px;
      font-weight: bold;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-custom:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(175, 64, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="https://avatars.githubusercontent.com/u/241029556?v=4" alt="Profile Picture" id="profile-pic">
    <h2 id="profile-name">Miguel Vonn Andrei Ykalina</h2>
    <p>Web Developer | Designer | Tech Enthusiast</p>
    <p>21 Years Old</p>
    <a href="#" class="btn-custom">Contact Me</a>
  </div>

</body>
</html>
