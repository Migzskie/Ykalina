<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade Calculator</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        input {
            margin-bottom: 10px;
            display: block;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
  <h1 class="text-center" style="color: rgb(70, 16, 95); background-color: rgba(0, 89, 255, 0); font-family: 'Minecraft AE', sans-serif;"> Grade Calculator </h1>
<body>

    <label>Prelim Grade:</label>
    <input type="number" id="prelim">

    <label>Midterm Grade:</label>
    <input type="number" id="midterm">

    <label>Semi-Finals Grade:</label>
    <input type="number" id="semifinals">

    <label>Finals Grade:</label>
    <input type="number" id="finals">

    <button id="calculate">Calculate Final Grade</button>

    <div id="result"></div>

    <script>
        $(document).ready(function () {
            $("#calculate").click(function () {
                // Retrieve input values
                let prelim = parseFloat($("#prelim").val());
                let midterm = parseFloat($("#midterm").val());
                let semifinals = parseFloat($("#semifinals").val());
                let finals = parseFloat($("#finals").val());

                // Weighted calculation
                let finalGrade = (prelim * 0.20) + (midterm * 0.20) + (semifinals * 0.20) + (finals * 0.40);

                // Display result with conditional message
                if (finalGrade >= 75) {
                    $("#result").text("Final Grade: " + finalGrade.toFixed(2) + " – Passed ✅");
                } else {
                    $("#result").text("Final Grade: " + finalGrade.toFixed(2) + " – Failed ❌");
                }
            });
        });
    </script>

</body>
</html>
