<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="">
    <script> src="jquery.js" </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
           body{
                background-color: rgb(255, 255, 255);
                background-image: url("https://cdn.wallpapersafari.com/30/0/n0HOqk.gif");
                background-position-x: center;
                background-repeat: no-repeat;
                background-size: 100%;
                display: flex;
                align-items: center;
                height: 100vh;

                }
 
                button {
                  align-items: center;
                  background-image: linear-gradient(144deg, #af40ff, #5b42f3 50%, #e300eb);
                  border: 0;
                  border-radius: 8px;
                  box-shadow: rgba(151, 65, 252, 0.2) 0 15px 30px -5px;
                  box-sizing: border-box;
                  color: #ffffff;
                  display: flex;
                  font-size: 18px;
                  justify-content: center;
                  line-height: 1em;
                  max-width: 100%;
                  min-width: 140px;
                  padding: 3px;
                  text-decoration: none;
                  user-select: none;
                  -webkit-user-select: none;
                  touch-action: manipulation;
                  white-space: nowrap;
                  cursor: pointer;
                  transition: all 0.3s;
                }

                button:active,
                button:hover {
                  outline: 0;
                }

                button span {
                  background-color: rgb(5, 6, 45);
                  padding: 16px 24px;
                  border-radius: 6px;
                  width: 100%;
                  height: 100%;
                  transition: 300ms;
                }

                button:hover span {
                  background: none;
                }

                button:active {
                  transform: scale(0.9);
                }
                input {
                background-color: #6c2fb3;
                border: none;
                padding: 1rem;
                font-size: 1rem;
                width: 13em;
                border-radius: 1rem;
                color: lightcoral;
                box-shadow: 0 0.4rem #dfd9d9;
                cursor: pointer;
                margin-bottom: 10px;
                }

                input:focus {
                outline-color: lightcoral;
                }

                
           div{
                background-color: rgba(255, 255, 255, 0.438);
                width: 450px;
                padding: 40px;
                border-radius: 16px;
                margin: auto;
                backdrop-filter: blur(8px);
           }
           button{
                    margin-top: 10px;
           }

    </style>

</head>
<body>

    <div>
    <head>
  <link href="https://fonts.cdnfonts.com/css/font" rel="stylesheet">
                
  </head>
<body>
  <h1 class="text-center" style="color: rgb(70, 16, 95); background-color: rgba(0, 89, 255, 0); font-family: 'Minecraft AE', sans-serif;"> Simple Calculator </h1>
</body>

    <label style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: bolder;"> Name </label> <br>
    <input type="text" style="background-color: lightblue; border: 1px solid blue; padding: 5px; font-weight; font-size:larger:  bold;" id="name" placeholder="Type here..." class="form-control">
    <label style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: bolder;"> First Number </label> <br>
    <input type="text" style="background-color: lightblue; border: 1px solid blue; padding: 5px; font-weight; font-size:larger: bold;" id="num1" placeholder="Type here..." class="form-control">
    <label style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: bolder;"> Second Number </label> <br>
    <input type="text" style="background-color: lightblue; border: 1px solid blue; padding: 5px; font-weight; font-size:larger: bold;" id="num2" placeholder="Type here..." class="form-control">
    <button style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #f8f8f8; background-color: #6c2fb3; font-weight: bold;" class="form-control btn btn-primary" id="btn">Calculate</button>
    <p type="text": style="font-weight: bolder;" id="fnum">First Number is:</p>
    <p type="text": style="font-weight: bolder;" id="snum">Second Number is:</p>
    <p type="text": style="font-weight: bolder;" id="fname"></p>
    <p type="text": style="font-weight: bolder;" id="result">The result will display here:</p>

</div>
</body>


<script type="text/javascript">

    $("#btn").click(function(){
        var name = $("#name").val()
        var fnum = +$("#num1").val()
        var snum = +$("#num2").val()

          var result = fnum + snum;

          $("#fname").text("Hello " + "" + name);
          $("#fnum").append(fnum);
          $("#snum").append(snum);
          $("#result").html("<strong>The result is: </strong>" + result)

    });
        
    </script>


</body>
</html>
